services:
  postgres:
    image: postgres:16-alpine
    container_name: walkthrough-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: walkthrough
      POSTGRES_PASSWORD: walkthrough
      POSTGRES_DB: walkthrough
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
