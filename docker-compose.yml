services:
  postgres:
    image: postgres:16-alpine
    container_name: expensetrac-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: expensetrac
      POSTGRES_PASSWORD: expensetrac
      POSTGRES_DB: expensetrac
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
